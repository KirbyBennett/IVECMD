name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # Stamp the pushed tag (v1.2.3 → 1.2.3) into package.json so the built
      # app and the "IVECMD ${version}" DMG are named after the tag, not the
      # hardcoded version committed in the repo.
      - name: Set version from tag
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Build app
        run: npm run build -- --publish never

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Set version from tag
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      - name: Build app
        run: npm run build -- --publish never
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
